<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>模型验证报告 - AuroraFin</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .validation-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e1e5e9;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-good { color: #16a34a; }
        .stat-warning { color: #f59e0b; }
        .stat-bad { color: #ef4444; }
    </style>
</head>
<body>
    <header class="app-header brand">
        <div class="container">
            <div class="brand-logo">
                <span class="mark"></span>
                <div>
                    <div class="name">VaR模型验证报告</div>
                    <div class="sub">AuroraFin 风险预测可靠性分析</div>
                </div>
            </div>
        </div>
    </header>

    <div class="validation-container">
        <div class="card">
            <h2>模型验证概览</h2>
            <div id="validation-results">
                <p>请先在风险预测页面运行推理，然后查看验证报告。</p>
            </div>
        </div>

        <div class="stats-grid" id="stats-grid">
            <!-- 动态填充统计信息 -->
        </div>

        <div class="actions">
            <button class="btn" onclick="window.history.back()">返回</button>
            <button class="btn primary" onclick="runValidation()">运行验证</button>
        </div>
    </div>

    <script>
        function runValidation() {
            const validationData = JSON.parse(sessionStorage.getItem('validationData') || '{}');
            
            // 检查必要的数据
            if (!validationData.returns || (!validationData.var_predictions && !validationData.quantile_predictions)) {
                document.getElementById('validation-results').innerHTML = 
                    '<p style="color: #ef4444;">没有找到验证数据。请先返回风险预测页面运行推理。</p>';
                return;
            }
            
            // 构建发送给后端的数据
            const requestData = {
                returns: validationData.returns,
                var_predictions: validationData.var_predictions,
                quantile_predictions: validationData.quantile_predictions,
                alpha: validationData.alpha || 0.05,
                validation_data: validationData.validation_data // 传递完整数据
            };
            
            fetch('/api/validation', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    displayValidationResults(data.report);
                } else {
                    document.getElementById('validation-results').innerHTML = 
                        `<p style="color: #ef4444;">验证失败: ${data.error}</p>`;
                }
            })
            .catch(error => {
                document.getElementById('validation-results').innerHTML = 
                    `<p style="color: #ef4444;">请求失败: ${error}</p>`;
            });
        }
        function displayValidationResults(report) {
            const resultsDiv = document.getElementById('validation-results');
            resultsDiv.innerHTML = `
                <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <h3 style="margin-top: 0;">验证结果摘要</h3>
                    <p><strong>数据周期：</strong>${report.total_periods} 个交易日</p>
                    <p><strong>综合偏差：</strong><span style="color: ${report.overall_bias <= 0.01 ? '#16a34a' : '#ef4444'}">${(report.overall_bias * 100).toFixed(2)}%</span></p>
                    <p><strong>置信度分数：</strong>${(report.confidence_score * 100).toFixed(1)}%</p>
                    <p><strong>性能评级：</strong>${report.performance_rating}</p>
                </div>
            `;
            
            // 更新统计网格，只显示综合偏差
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div>综合偏差</div>
                    <div class="stat-value ${getStatColor(1 - report.overall_bias, 0.99)}">
                        ${(report.overall_bias * 100).toFixed(2)}%
                    </div>
                    <div>所有分位加权</div>
                </div>
                <div class="stat-card">
                    <div>置信度分数</div>
                    <div class="stat-value ${getStatColor(report.confidence_score, 0.7)}">
                        ${(report.confidence_score * 100).toFixed(1)}%
                    </div>
                    <div>模型可靠性</div>
                </div>
                <div class="stat-card">
                    <div>性能评级</div>
                    <div class="stat-value">${report.performance_rating}</div>
                    <div>基于综合偏差</div>
                </div>
            `;
        }
        
        function getStatColor(value, benchmark) {
            if (Math.abs(value - benchmark) <= benchmark * 0.1) return 'stat-good';
            if (Math.abs(value - benchmark) <= benchmark * 0.2) return 'stat-warning';
            return 'stat-bad';
        }

        // 页面加载时检查是否有验证数据
        document.addEventListener('DOMContentLoaded', function() {
            const validationData = JSON.parse(sessionStorage.getItem('validationData') || '{}');
            if (validationData.returns && validationData.var_predictions) {
                document.getElementById('validation-results').innerHTML = 
                    '<p>检测到验证数据，点击"运行验证"按钮生成报告。</p>';
            }
        });
    </script>
</body>
</html>
